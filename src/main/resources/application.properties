# --- swop.cx integration -------------------------------------------------
# API key is REQUIRED and resolved from the SWOP_API_KEY env var so it never
# ends up in source control or in container images. The empty default lets
# SwopProperties validation report a missing key clearly at startup.
swop.api-key=${SWOP_API_KEY:}
swop.base-url=https://swop.cx
swop.connect-timeout=5s
swop.read-timeout=10s

# --- Cache ---------------------------------------------------------------
# Declares Caffeine as the cache provider. Per-cache TTLs and sizes are set
# programmatically in CacheConfig (rates: 5min, currencies: 24h) — keeping
# them in code rather than spring.cache.caffeine.spec because that property
# applies a single spec to every cache, which we no longer want.
spring.cache.type=caffeine

# --- Actuator + Micrometer + InfluxDB ------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.influx.metrics.export.uri=http://localhost:8086
management.influx.metrics.export.db=currency_converter
management.influx.metrics.export.step=10s
# Disable Influx export by default in profiles where Influx isn't running
# (e.g. local dev / tests). Override to true via the docker-compose stack.
management.influx.metrics.export.enabled=false

# --- Server --------------------------------------------------------------
server.port=8080
